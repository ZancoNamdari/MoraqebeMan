{% extends "base.html" %}
{% block title %}زیباپلاس — سفارش‌های من{% endblock %}

{% block navbar %}
<nav class="navbar-custom">
  <span class="navbar-title">سفارش‌های من</span>
  <div style="width:38px;"></div>
</nav>
{% endblock %}

{% block content %}
<div class="px-page pt-3">
  <div id="orders-list">
    <div class="skeleton" style="height:90px;border-radius:var(--radius);margin-bottom:10px;"></div>
    <div class="skeleton" style="height:90px;border-radius:var(--radius);margin-bottom:10px;"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
requireAuth();

async function loadOrders() {
  const el = document.getElementById('orders-list');
  try {
    const res = await fetch(`${API}/orders/mine/`, { headers: authHeaders() });
    if (!res.ok) throw new Error('failed');
    const orders = await res.json();
    renderOrders(orders);
  } catch {
    el.innerHTML = `<div class="empty-state"><i class="bi bi-exclamation-circle"></i><h4>مشکلی در بارگذاری سفارش‌ها پیش آمد</h4></div>`;
  }
}

const statusCfg = {
  pending:{label:'در انتظار تأیید فروشگاه',bg:'#FEF3C7',color:'#92400E'},
  confirmed:{label:'تأیید و در حال آماده‌سازی',bg:'var(--primary-light)',color:'var(--primary-dark)'},
  completed:{label:'تحویل داده شد',bg:'#F3F4F6',color:'#374151'},
  rejected:{label:'رد شده',bg:'#FEE2E2',color:'#991B1B'},
  cancelled:{label:'لغو شده',bg:'#FEE2E2',color:'#991B1B'},
};

function renderOrders(orders) {
  const el = document.getElementById('orders-list');
  if (!orders.length) {
    el.innerHTML = `<div class="empty-state"><i class="bi bi-bag-x"></i><h4>هنوز سفارشی ثبت نکرده‌اید</h4></div>`;
    return;
  }
  el.innerHTML = orders.map(o => {
    const cfg = statusCfg[o.status] || statusCfg.pending;
    return `
      <div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px;">
          <div>
            <div style="font-size:14px;font-weight:700;">${o.store_name}</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${o.items.length} قلم کالا</div>
          </div>
          <span class="badge" style="color:${cfg.color};background:${cfg.bg};">${o.status_display || cfg.label}</span>
        </div>
        ${o.items.map(it => `<div style="font-size:12px;color:var(--text-muted);padding:2px 0;">${it.product_name} × ${toPersianDigits(it.quantity)}</div>`).join('')}
        <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);margin-top:8px;padding-top:8px;font-size:13px;font-weight:700;">
          <span>${toHijriDate(o.created_at)}</span>
          <span>${formatMoney(o.total_amount)}</span>
        </div>
        ${o.status === 'pending' ? `<button class="btn-outline btn-sm" style="margin-top:10px;" onclick="cancelOrder(${o.id})">لغو سفارش</button>` : ''}
      </div>`;
  }).join('');
}

async function cancelOrder(id) {
  if (!confirm('این سفارش لغو شود؟')) return;
  try {
    const res = await fetch(`${API}/orders/${id}/cancel/`, { method: 'POST', headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'خطا در لغو سفارش'); return; }
    showToast('سفارش لغو شد - مبلغ به کیف‌پولتان بازگشت داده شد ✓');
    loadOrders();
  } catch {
    showToast('مشکلی در ارتباط با سرور پیش آمد');
  }
}

loadOrders();
</script>
{% endblock %}
