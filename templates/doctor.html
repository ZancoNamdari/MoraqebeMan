{% extends "base.html" %}
{% block title %}زیباپلاس — پزشک{% endblock %}

{% block navbar %}
<nav class="navbar-custom">
  <button class="back-btn" onclick="history.back()"><i class="bi bi-arrow-right"></i></button>
  <span class="navbar-title" id="dr-name-title">پزشک</span>
  <div style="width:38px;"></div>
</nav>
{% endblock %}

{% block content %}
<div class="px-page pt-3">

  <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px;">
    <div id="dr-photo" style="width:76px;height:76px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;flex-shrink:0;">👨‍⚕️</div>
    <div style="flex:1;">
      <h3 style="font-size:17px;font-weight:800;" id="dr-name">در حال بارگذاری...</h3>
      <p style="font-size:12.5px;color:var(--text-muted);margin-top:2px;" id="dr-specialty"></p>
      <div style="font-size:12.5px;color:#D97706;margin-top:4px;"><i class="bi bi-star-fill"></i> <span id="dr-rating">—</span></div>
    </div>
  </div>

  <div style="font-size:12.5px;color:var(--text-muted);line-height:2;margin-bottom:14px;">
    <div><i class="bi bi-geo-alt"></i> <span id="dr-city-address"></span></div>
    <div><i class="bi bi-telephone"></i> <span id="dr-phone" style="direction:ltr;display:inline-block;"></span></div>
    <div id="dr-clinic-row" style="display:none;"><i class="bi bi-hospital"></i> <span id="dr-clinic-name"></span></div>
  </div>

  <div id="dr-social-links" style="display:flex;gap:8px;margin-bottom:16px;"></div>

  <p style="font-size:13px;color:var(--text-main);line-height:1.9;margin-bottom:18px;" id="dr-bio"></p>

  <div style="display:flex;gap:10px;margin-bottom:20px;">
    <button class="btn-primary" style="flex:1;" onclick="openModal('modal-book-appointment')"><i class="bi bi-calendar2-plus"></i> رزرو نوبت</button>
    <button class="btn-outline" style="flex:1;" onclick="startChat()"><i class="bi bi-chat-dots"></i> گفتگو</button>
  </div>

  <div class="section-title">لیست تعرفه‌ها</div>
  <div id="dr-tariffs" style="margin-bottom:20px;"></div>

  <div class="section-title">پست‌ها</div>
  <div id="dr-posts" style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:20px;"></div>

  <div class="section-title">نظرات بیماران</div>
  <div id="dr-reviews" style="margin-bottom:40px;"></div>

</div>
{% endblock %}

{% block modals %}
<div class="modal-overlay" id="modal-book-appointment" onclick="closeModal('modal-book-appointment')">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">رزرو نوبت</div>
    <div class="input-group-custom"><label>نام و نام خانوادگی</label><input class="input-custom" id="appt-fullname" /></div>
    <div class="input-group-custom"><label>کد ملی</label><input class="input-custom" id="appt-nationalid" maxlength="10" /></div>
    <div class="input-group-custom"><label>شماره تماس</label><input class="input-custom" type="tel" id="appt-phone" /></div>
    <div class="input-group-custom"><label>نوع بیماری / علت مراجعه</label><input class="input-custom" id="appt-disease" /></div>
    <div class="input-group-custom">
      <label>تاریخ (شمسی)</label>
      <input class="input-custom" type="text" id="appt-date" readonly placeholder="انتخاب تاریخ" onclick="openDatePicker(onApptDateSelected, apptDateGregorian)" style="cursor:pointer;background:var(--white);" />
    </div>
    <div class="input-group-custom">
      <label>ساعت</label>
      <input class="input-custom" type="text" id="appt-time" readonly placeholder="انتخاب ساعت" onclick="openTimePicker(onApptTimeSelected, apptTimeValue)" style="cursor:pointer;background:var(--white);" />
    </div>
    <div class="input-group-custom"><label>تصویر کارت ملی (اختیاری)</label><input class="input-custom" type="file" id="appt-idcard" accept="image/*" /></div>
    <div class="input-group-custom"><label>تصویر نسخه پزشک (اختیاری)</label><input class="input-custom" type="file" id="appt-prescription" accept="image/*" /></div>
    <button class="btn-primary" id="btn-submit-appointment" onclick="submitAppointment()">ثبت درخواست نوبت</button>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
requireAuth();

const doctorId = new URLSearchParams(window.location.search).get('id');
let currentDoctorData = null;
let apptDateGregorian = null;
let apptTimeValue = null;

async function loadDoctor() {
  try {
    const res = await fetch(`${API}/doctors/${doctorId}/`);
    if (!res.ok) throw new Error('not found');
    currentDoctorData = await res.json();
    renderDoctor();
    loadReviews();
  } catch {
    document.getElementById('dr-name-title').textContent = 'پزشک پیدا نشد';
    document.getElementById('dr-name').textContent = 'این صفحه در دسترس نیست';
  }
}

function renderDoctor() {
  const d = currentDoctorData;
  document.getElementById('dr-name-title').textContent = d.full_name;
  document.getElementById('dr-name').textContent = d.full_name;
  document.getElementById('dr-specialty').textContent = d.specialty || '';
  document.getElementById('dr-rating').textContent = d.rating && Number(d.rating) > 0 ? toPersianDigits(d.rating) : '—';
  document.getElementById('dr-city-address').textContent = `${d.city || ''} ${d.address || ''}`;
  document.getElementById('dr-phone').textContent = d.phone || '';
  document.getElementById('dr-bio').textContent = d.bio || '';

  if (d.clinic_name) {
    document.getElementById('dr-clinic-row').style.display = 'block';
    document.getElementById('dr-clinic-name').textContent = d.clinic_name;
  }

  if (d.photo_url) {
    document.getElementById('dr-photo').innerHTML = `<img src="${d.photo_url}" style="width:100%;height:100%;object-fit:cover;" />`;
  }

  const linksEl = document.getElementById('dr-social-links');
  const links = [];
  if (d.instagram) links.push(`<a href="https://instagram.com/${d.instagram}" target="_blank" class="btn-outline btn-sm" style="width:auto;text-decoration:none;"><i class="bi bi-instagram"></i></a>`);
  if (d.rubika) links.push(`<span class="btn-outline btn-sm" style="width:auto;">روبیکا</span>`);
  if (d.bale) links.push(`<span class="btn-outline btn-sm" style="width:auto;">بله</span>`);
  linksEl.innerHTML = links.join('');

  const tariffsEl = document.getElementById('dr-tariffs');
  tariffsEl.innerHTML = (d.tariffs || []).filter(t => t.is_active).map(t => `
    <div style="display:flex;justify-content:space-between;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;font-size:13px;">
      <span>${t.title}</span><span style="font-weight:700;color:var(--primary-dark);">${formatMoney(t.price)}</span>
    </div>`).join('') || `<p style="font-size:12px;color:var(--text-muted);">تعرفه‌ای ثبت نشده</p>`;

  const postsEl = document.getElementById('dr-posts');
  postsEl.innerHTML = (d.posts || []).map(p => `
    <div style="aspect-ratio:1/1;background:var(--bg);overflow:hidden;">
      ${p.media_type === 'image' ? `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;" />` : `<video src="${p.video}" style="width:100%;height:100%;object-fit:cover;" muted></video>`}
    </div>`).join('') || `<p style="font-size:12px;color:var(--text-muted);grid-column:span 3;">پستی ثبت نشده</p>`;
}

async function loadReviews() {
  const el = document.getElementById('dr-reviews');
  try {
    const res = await fetch(`${API}/doctors/${doctorId}/reviews/`);
    const reviews = await res.json();
    if (!reviews.length) { el.innerHTML = `<p style="font-size:12px;color:var(--text-muted);">هنوز نظری ثبت نشده</p>`; return; }
    el.innerHTML = reviews.map(r => `
      <div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
          <span style="font-size:12.5px;font-weight:700;">${r.patient_name || 'بیمار'}</span>
          <span style="color:#D97706;font-size:12px;">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
        </div>
        <p style="font-size:12px;color:var(--text-muted);">${r.comment || ''}</p>
      </div>`).join('');
  } catch {
    el.innerHTML = `<p style="font-size:12px;color:var(--text-muted);">مشکلی در بارگذاری نظرات پیش آمد</p>`;
  }
}

function onApptDateSelected(iso, display) {
  apptDateGregorian = iso;
  document.getElementById('appt-date').value = display;
}
function onApptTimeSelected(value24, display) {
  apptTimeValue = value24;
  document.getElementById('appt-time').value = display;
}

async function submitAppointment() {
  const fullName = document.getElementById('appt-fullname').value.trim();
  const nationalId = document.getElementById('appt-nationalid').value.trim();
  const phone = document.getElementById('appt-phone').value.trim();
  const disease = document.getElementById('appt-disease').value.trim();

  if (!fullName || !nationalId || !phone || !disease) { showToast('همه فیلدها الزامی هستند'); return; }
  if (!apptDateGregorian || !apptTimeValue) { showToast('تاریخ و ساعت را انتخاب کنید'); return; }

  const btn = document.getElementById('btn-submit-appointment');
  setLoading(btn, true, 'در حال ثبت...');

  const formData = new FormData();
  formData.append('doctor', doctorId);
  formData.append('full_name', fullName);
  formData.append('national_id', nationalId);
  formData.append('phone', phone);
  formData.append('disease_type', disease);
  formData.append('requested_date', apptDateGregorian);
  formData.append('requested_time', apptTimeValue);
  const idCard = document.getElementById('appt-idcard').files[0];
  const prescription = document.getElementById('appt-prescription').files[0];
  if (idCard) formData.append('id_card_image', idCard);
  if (prescription) formData.append('prescription_image', prescription);

  try {
    const res = await fetch(`${API}/doctor-appointments/`, {
      method: 'POST', headers: { 'Authorization': authHeaders()['Authorization'] }, body: formData,
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'خطا در ثبت نوبت'); return; }
    showToast('درخواست نوبت ثبت شد ✓');
    closeModal('modal-book-appointment');
    setTimeout(() => window.location.href = '/doctor-appointments/', 1200);
  } catch {
    showToast('مشکلی در ارتباط با سرور پیش آمد');
  } finally {
    setLoading(btn, false, 'ثبت درخواست نوبت');
  }
}

async function startChat() {
  try {
    const res = await fetch(`${API}/doctor-chat/start/`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ doctor: doctorId }) });
    if (!res.ok) throw new Error();
    const conv = await res.json();
    window.location.href = `/doctor-chat/?conversation=${conv.id}`;
  } catch {
    showToast('مشکلی در شروع گفتگو پیش آمد');
  }
}

loadDoctor();
</script>
{% endblock %}
