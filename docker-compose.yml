x-django-env: &django-env
  DJANGO_ENV: ${DJANGO_ENV:-development}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret-change-in-prod}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-change-me-super-secret}
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
  REDIS_URL: redis://redis:6379/0

services:
  # ---------- infrastructure ----------
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_identity:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: identity_pass
    ports: ["5436:5432"]
    volumes:
      - pg_identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_user -d identity_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- identity service ----------
  # The only service with real code so far — see services/identity_service.
  # All other services/* directories are placeholders (empty), so they are
  # intentionally NOT wired up here yet; add each one to this file as it
  # gets built out, following this same pattern.
  identity_service:
    build: ./services/identity_service
    command: python manage.py runserver 0.0.0.0:8004
    environment:
      <<: *django-env
      DATABASE_URL: postgres://identity_user:identity_pass@postgres_identity:5432/identity_db
      ALLOWED_HOSTS: "*"
    volumes:
      - ./services/identity_service:/app
    ports: ["8004:8004"]
    depends_on:
      postgres_identity:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  identity_worker:
    build: ./services/identity_service
    command: celery -A config worker -l info
    environment:
      <<: *django-env
      DATABASE_URL: postgres://identity_user:identity_pass@postgres_identity:5432/identity_db
      RUN_MIGRATIONS: "0"
    volumes:
      - ./services/identity_service:/app
    depends_on:
      identity_service:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started

volumes:
  pg_identity_data:
