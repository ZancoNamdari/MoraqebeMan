

x-django-env: &django-env
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-change-me-super-secret}
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
  REDIS_URL: redis://redis:6379/0
  ELASTICSEARCH_URL: http://elasticsearch:9200

services:
  # ---------- infrastructure ----------
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - es_data:/usr/share/elasticsearch/data

  postgres_auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports: ["5443:5432"]
    volumes:
      - pg_auth_data:/var/lib/postgresql/data

  postgres_search:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: search_db
      POSTGRES_USER: search_user
      POSTGRES_PASSWORD: search_pass
    ports: ["5434:5432"]
    volumes:
      - pg_search_data:/var/lib/postgresql/data

  # ---------- auth service ----------
  auth_service:
    build: ./services/auth_service
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8001"
    environment:
      <<: *django-env
      DATABASE_URL: postgres://auth_user:auth_pass@postgres_auth:5432/auth_db
    volumes:
      - ./services/auth_service:/app
    ports: ["8001:8001"]
    depends_on:
      - postgres_auth
      - redis
      - rabbitmq

  auth_worker:
    build: ./services/auth_service
    command: celery -A config worker -l info
    environment:
      <<: *django-env
      DATABASE_URL: postgres://auth_user:auth_pass@postgres_auth:5432/auth_db
    volumes:
      - ./services/auth_service:/app
    depends_on:
      - auth_service
      - rabbitmq
      - redis

  # ---------- search service ----------
  search_service:
    build: ./services/search_service
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8002"
    environment:
      <<: *django-env
      DATABASE_URL: postgres://search_user:search_pass@postgres_search:5432/search_db
    volumes:
      - ./services/search_service:/app
    ports: ["8002:8002"]
    depends_on:
      - postgres_search
      - elasticsearch
      - redis
      - rabbitmq

  search_worker:
    build: ./services/search_service
    command: celery -A config worker -l info
    environment:
      <<: *django-env
      DATABASE_URL: postgres://search_user:search_pass@postgres_search:5432/search_db
    volumes:
      - ./services/search_service:/app
    depends_on:
      - search_service
      - rabbitmq
      - elasticsearch

  # ---------- gateway ----------
  gateway:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - search_service

volumes:
  pg_auth_data:
  pg_search_data:
  es_data:
