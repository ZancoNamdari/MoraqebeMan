# Phase 1 monolith stack — replaces the previous per-service compose
# file. Deliberately simple: one Django project (backend/), one
# Postgres, one Redis (cache + Celery broker/result-backend — no
# RabbitMQ, no per-service databases). See the architecture doc's
# "why monolith for phase 1" section for the cost rationale, and its
# migration section for how this expands back into microservices later.

x-django-env: &django-env
  DJANGO_ENV: ${DJANGO_ENV:-development}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret-change-in-prod}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-change-me-super-secret}
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moraqebeman_db
      POSTGRES_USER: moraqebeman_user
      POSTGRES_PASSWORD: moraqebeman_pass
    ports: ["5440:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moraqebeman_user -d moraqebeman_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      <<: *django-env
      DATABASE_URL: postgres://moraqebeman_user:moraqebeman_pass@postgres:5432/moraqebeman_db
      ALLOWED_HOSTS: "*"
    volumes:
      - ./backend:/app
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  backend_worker:
    build: ./backend
    command: celery -A config worker -l info
    environment:
      <<: *django-env
      DATABASE_URL: postgres://moraqebeman_user:moraqebeman_pass@postgres:5432/moraqebeman_db
      RUN_MIGRATIONS: "0"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pg_data:
