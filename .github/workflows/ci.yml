name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: moraqebeman_db
          POSTGRES_USER: moraqebeman_user
          POSTGRES_PASSWORD: moraqebeman_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moraqebeman_user -d moraqebeman_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DJANGO_ENV: development
      JWT_SIGNING_KEY: ci-test-signing-key
      DATABASE_URL: postgres://moraqebeman_user:moraqebeman_pass@localhost:5432/moraqebeman_db
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        working-directory: backend
        run: python manage.py test tests
