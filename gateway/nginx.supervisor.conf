events {
    worker_connections 1024;
}

http {
    client_max_body_size 10M;

    upstream supervisor_panel {
        server supervisor_panel:3000;
    }

    upstream agency_panel {
        server agency_panel:3000;
    }

    upstream family_panel {
        server family_panel:3000;
    }

    upstream patient_panel {
        server patient_panel:3000;
    }

    upstream caregiver_panel {
        server caregiver_panel:3000;
    }

    upstream admin_panel {
        server admin_panel:3000;
    }

    upstream superuser_panel {
        server superuser_panel:3000;
    }

    upstream landing_page {
        server landing_page:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # =========================
    # Supervisor HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name supervisor.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # API HTTP
    # =========================
    server {
        listen 80;
        server_name api.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================
    # Agency HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name agency.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # Family HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name family.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # Patient HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name patient.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # Caregiver HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name caregiver.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # Admin HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name admin.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # Superuser HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name superuser.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # Landing Page HTTP -> HTTPS
    # (root domain + www — the site's actual homepage, no extra
    # subdomain needed to reach it)
    # =========================
    server {
        listen 80;
        server_name moraqebman.ir www.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # API HTTPS
    # =========================
    server {
        listen 443 ssl;
        server_name api.moraqebman.ir;

        ssl_certificate /etc/letsencrypt/live/api.moraqebman.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.moraqebman.ir/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================
    # Agency HTTPS
    # =========================
    server {
        listen 443 ssl;
        server_name agency.moraqebman.ir;

        ssl_certificate /etc/letsencrypt/live/agency.moraqebman.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agency.moraqebman.ir/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://agency_panel;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # =========================
    # Supervisor HTTPS
    # =========================
    server {
        listen 443 ssl;
        server_name supervisor.moraqebman.ir;

        ssl_certificate /etc/letsencrypt/live/supervisor.moraqebman.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/supervisor.moraqebman.ir/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://supervisor_panel;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
