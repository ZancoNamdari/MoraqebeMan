events {
    worker_connections 1024;
}

http {
    client_max_body_size 10M;

    # Dynamic DNS resolution fix — this is the permanent solution to
    # the "rebuild a panel, content scrambles until nginx is manually
    # restarted" issue hit repeatedly throughout this deployment.
    # Without this, nginx resolves each upstream hostname exactly
    # once at startup and caches that IP forever; every time Docker
    # recreates a container (any rebuild), it gets a new internal IP
    # that nginx never learns about until a full restart. The
    # `resolve` parameter below (a genuinely open-sourced nginx
    # feature since 1.27.3 — confirmed we're on 1.27.5) tells nginx to
    # periodically re-check each upstream's DNS through Docker's own
    # embedded resolver (127.0.0.11) instead of caching indefinitely.
    # `nginx -s reload` still works for config *file* changes; this
    # specifically handles container IP changes without needing any
    # restart at all.
    resolver 127.0.0.11 valid=10s;

    upstream supervisor_panel {
        zone supervisor_panel_zone 64k;
        server supervisor_panel:3000 resolve;
    }

    upstream agency_panel {
        zone agency_panel_zone 64k;
        server agency_panel:3000 resolve;
    }

    upstream family_panel {
        zone family_panel_zone 64k;
        server family_panel:3000 resolve;
    }

    upstream patient_panel {
        zone patient_panel_zone 64k;
        server patient_panel:3000 resolve;
    }

    upstream caregiver_panel {
        zone caregiver_panel_zone 64k;
        server caregiver_panel:3000 resolve;
    }

    upstream admin_panel {
        zone admin_panel_zone 64k;
        server admin_panel:3000 resolve;
    }

    upstream superuser_panel {
        zone superuser_panel_zone 64k;
        server superuser_panel:3000 resolve;
    }

    upstream landing_page {
        zone landing_page_zone 64k;
        server landing_page:3000 resolve;
    }

    upstream backend {
        zone backend_zone 64k;
        server backend:8000 resolve;
    }

    # =========================
    # Supervisor HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name supervisor.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # API HTTP
    # =========================
    server {
        listen 80;
        server_name api.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================
    # Agency HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name agency.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # Family HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name family.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # Patient HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name patient.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # Caregiver HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name caregiver.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # Admin HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name admin.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # Superuser HTTP -> HTTPS
    # =========================
    server {
        listen 80;
        server_name superuser.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # Landing Page HTTP -> HTTPS
    # (root domain + www — the site's actual homepage, no extra
    # subdomain needed to reach it)
    # =========================
    server {
        listen 80;
        server_name moraqebman.ir www.moraqebman.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================
    # API HTTPS
    # =========================
    server {
        listen 443 ssl;
        server_name api.moraqebman.ir;

        ssl_certificate /etc/letsencrypt/live/api.moraqebman.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.moraqebman.ir/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================
    # Agency HTTPS
    # =========================
    server {
        listen 443 ssl;
        server_name agency.moraqebman.ir;

        ssl_certificate /etc/letsencrypt/live/agency.moraqebman.ir/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agency.moraqebman.ir/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://agency_panel;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # =========================
