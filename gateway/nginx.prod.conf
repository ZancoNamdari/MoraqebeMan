# nginx تولید — مسیریابی بر اساس زیردامنه به بک‌اند و هر پنج پنل.
# جایگزین کامل gateway/nginx.conf (که یک placeholder توسعه است و فقط
# به بک‌اند می‌رود — هنوز برای dev محلی نگه‌داشته شده، dockerfile آن
# را جایگزین نمی‌کند).
#
# قبل از استفاده: هر «moraqebeman.ir» را با دامنه واقعی خودتان
# جایگزین کنید (پنج جای مختلف در این فایل).
#
# این نسخه فقط HTTP (پورت ۸۰) است — گام بعدی افزودن SSL با Certbot،
# دقیقاً طبق docs/DEPLOYMENT.md، که یک بلوک HTTPS برای هر server اضافه
# می‌کند و ترافیک HTTP را به HTTPS ریدایرکت می‌کند.

events {
    worker_connections 1024;
}

http {
    client_max_body_size 10M;

    upstream backend {
        server backend:8000;
    }
    upstream landing_page {
        server landing_page:3000;
    }
    upstream family_panel {
        server family_panel:3000;
    }
    upstream patient_panel {
        server patient_panel:3000;
    }
    upstream caregiver_panel {
        server caregiver_panel:3000;
    }
    upstream supervisor_panel {
        server supervisor_panel:3000;
    }

    # --- API ---
    server {
        listen 80;
        server_name api.moraqebeman.ir;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- صفحه فرود (دامنه اصلی) ---
    server {
        listen 80;
        server_name moraqebeman.ir www.moraqebeman.ir;

        location / {
            proxy_pass http://landing_page;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- پنل خانواده ---
    server {
        listen 80;
        server_name family.moraqebeman.ir;

        location / {
            proxy_pass http://family_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- پنل بیمار ---
    server {
        listen 80;
        server_name patient.moraqebeman.ir;

        location / {
            proxy_pass http://patient_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- پنل مراقب ---
    server {
        listen 80;
        server_name caregiver.moraqebeman.ir;

        location / {
            proxy_pass http://caregiver_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- پنل ناظر ---
    server {
        listen 80;
        server_name supervisor.moraqebeman.ir;

        location / {
            proxy_pass http://supervisor_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
