# nginx تولید — مسیریابی بر اساس زیردامنه به بک‌اند و هر هفت پنل.
# جایگزین کامل gateway/nginx.conf (که یک placeholder توسعه است و فقط
# به بک‌اند می‌رود — هنوز برای dev محلی نگه‌داشته شده، dockerfile آن
# را جایگزین نمی‌کند).
#
# قبل از استفاده: هر «moraqebman.ir» را با دامنه واقعی خودتان
# جایگزین کنید (هفت جای مختلف در این فایل).
#
# این نسخه فقط HTTP (پورت ۸۰) است — گام بعدی افزودن SSL با Certbot،
# دقیقاً طبق docs/DEPLOYMENT.md، که یک بلوک HTTPS برای هر server اضافه
# می‌کند و ترافیک HTTP را به HTTPS ریدایرکت می‌کند.

events {
    worker_connections 1024;
}

http {
    client_max_body_size 10M;

    upstream backend {
        server backend:8000;
    }
    upstream landing_page {
        server landing_page:3000;
    }
    upstream family_panel {
        server family_panel:3000;
    }
    upstream patient_panel {
        server patient_panel:3000;
    }
    upstream caregiver_panel {
        server caregiver_panel:3000;
    }
    upstream supervisor_panel {
        server supervisor_panel:3000;
    }
    upstream agency_panel {
        server agency_panel:3000;
    }
    upstream admin_panel {
        server admin_panel:3000;
    }
    upstream superuser_panel {
        server superuser_panel:3000;
    }

    # --- API ---
    server {
        listen 80;
        server_name api.moraqebman.ir;

        # فایل‌های آپلودشده (فعلاً فقط فایل صوتی شکایات) — مستقیماً از
        # همان volume که به بک‌اند هم داده شده، بدون عبور از gunicorn،
        # چون سرو کردن فایل استاتیک توسط nginx برای این نوع فایل‌ها
        # کارآمدتر است. قبل از این تغییر، هیچ location ای برای مسیر
        # media وجود نداشت — یعنی فایل آپلودشده در production اصلاً از
        # طریق URL قابل دسترسی نبود.
        location /media/ {
            alias /app/media/;
        }

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- صفحه فرود (دامنه اصلی) ---
    server {
        listen 80;
        server_name moraqebman.ir www.moraqebman.ir;

        location / {
            proxy_pass http://landing_page;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- پنل خانواده ---
    server {
        listen 80;
        server_name family.moraqebman.ir;

        location / {
            proxy_pass http://family_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- پنل بیمار ---
    server {
        listen 80;
        server_name patient.moraqebman.ir;

        location / {
            proxy_pass http://patient_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- پنل مراقب ---
    server {
        listen 80;
        server_name caregiver.moraqebman.ir;

        location / {
            proxy_pass http://caregiver_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- پنل ناظر ---
    server {
        listen 80;
        server_name supervisor.moraqebman.ir;

        location / {
            proxy_pass http://supervisor_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- پنل آژانس ---
    server {
        listen 80;
        server_name agency.moraqebman.ir;

        location / {
            proxy_pass http://agency_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- پنل ادمین ---
    server {
        listen 80;
        server_name admin.moraqebman.ir;

        location / {
            proxy_pass http://admin_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- پنل سوپریوزر ---
    server {
        listen 80;
        server_name superuser.moraqebman.ir;

        location / {
            proxy_pass http://superuser_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
