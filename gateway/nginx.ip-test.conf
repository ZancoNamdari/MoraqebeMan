# nginx برای فاز تست بدون دامنه — مسیریابی بر اساس PATH روی یک IP،
# نه زیردامنه (که در gateway/nginx.prod.conf پیاده شده و نیاز به یک
# دامنه واقعی دارد که زیردامنه‌هایش قابل تنظیم باشد). این فایل کاملاً
# جداست تا وقتی دامنه واقعی آماده شد، به‌جای این فایل، همان
# nginx.prod.conf با معماری زیردامنه استفاده شود — نه اینکه این دو
# رویکرد با هم قاطی شوند.
#
# هر پنل با پیشوند مسیر خودش در دسترس است، مثلاً:
#   http://<IP>/supervisor/login
#
# برای اینکه این کار کند، خود اپ Next.js هم باید با همین پیشوند
# build شده باشد (متغیر build-time به اسم NEXT_PUBLIC_BASE_PATH در
# docker-compose.ip-test.yml) — این فایل نگین‌اکس به‌تنهایی کافی نیست.
#
# فعلاً فقط پنل supervisor پیاده شده — برای هر پنل دیگر، هم یک
# location مشابه اینجا اضافه کنید و هم NEXT_PUBLIC_BASE_PATH متناظرش
# را در docker-compose.ip-test.yml تنظیم کنید.

events {
    worker_connections 1024;
}

http {
    client_max_body_size 10M;

    upstream supervisor_panel {
        server supervisor_panel:3000;
    }

    server {
        listen 80;

        # No trailing slash in this location pattern — matches BOTH
        # "/supervisor" and "/supervisor/anything" as one prefix, and
        # passes the request through unchanged either way. This was
        # originally two separate rules (a proxy for "/supervisor/"
        # plus a redirect from bare "/supervisor" to "/supervisor/"),
        # which created a genuine infinite redirect loop: Next.js's
        # own basePath handling redirects "/supervisor/" -> "/supervisor"
        # (its default, no-trailing-slash preference), directly
        # fighting the old redirect rule that pushed the opposite way.
        # Confirmed via curl -L before landing on this fix — the old
        # config alternated 308/301 forever. Letting Next.js own the
        # trailing-slash decision, rather than nginx opinionating
        # about it too, removes the conflict entirely.
        location /supervisor {
            proxy_pass http://supervisor_panel;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
