# Local dev gateway only — routes everything to the Django backend,
# matching docker-compose.yml's dev setup (no frontend containers in
# dev; each panel runs directly via `npm run dev` on its own port
# instead). For the real production gateway routing to the backend
# AND all five frontend containers by subdomain, see
# gateway/nginx.prod.conf (used by docker-compose.prod.yml) and
# docs/DEPLOYMENT.md.
events {}

http {
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
